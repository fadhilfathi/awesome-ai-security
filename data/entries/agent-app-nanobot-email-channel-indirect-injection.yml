id: agent-app-nanobot-email-channel-indirect-injection
title: "Zero-click indirect prompt injection through the nanobot email channel"
tier: 2
attack_class: PROMPT_INJECTION_INDIRECT
target: "nanobot personal AI assistant, pip package versions <= 0.1.4.post5, email channel"
date: "2026-03-27"
summary: >-
  Bitslab reported that nanobot's email channel decides who is allowed to
  command it by reading the From header of raw mail and trusting it
  against an allowlist, with no SPF, DKIM or DMARC evaluation. An
  unauthenticated attacker can therefore forge the header, send a message
  to the polled inbox, and have the body ingested as a trusted
  instruction set; the advisory is GHSA-4gmr-2vc8-7qh3, CVE-2026-33654.
  The maintainers released the patch as version 0.1.6.
impact: >-
  The advisory states the injected text can drive the agent's tools with
  no interaction from the bot owner: reading its own config, including
  the API keys, posting it to an attacker URL, or running a reverse
  shell through the execution tool if that tool is enabled.
  CREDENTIAL_EXPOSURE and AGENT_PRIVILEGE_ABUSE were both considered;
  the taxonomy keys the class on the step that yielded capability, and
  that step is the retrieved email body, which any remote sender can
  write, so the entry is filed as indirect injection.
mitigation: >-
  Upgrade to 0.1.6 or later. Until then, or for forks, stop deriving
  identity from the From header and instead parse the
  Authentication-Results header and require spf=pass and dkim=pass; keep
  email polling off by default; tag mail as external context and run it
  through a restricted tool set rather than the main agent loop.
sources:
  - url: https://github.com/HKUDS/nanobot/security/advisories/GHSA-4gmr-2vc8-7qh3
    kind: primary
    title: "Zero-Click Indirect Prompt Injection and Authentication Bypass via Email Polling (GHSA-4gmr-2vc8-7qh3)"
  - url: https://cveawg.mitre.org/api/cve/CVE-2026-33654
    kind: primary
    title: "CVE-2026-33654 nanobot email channel record"
cve:
  - CVE-2026-33654
last_verified: "2026-10-04"