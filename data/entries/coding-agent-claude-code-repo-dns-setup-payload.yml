id: coding-agent-claude-code-repo-dns-setup-payload
title: "Claude Code reverse shell from a clean repository whose setup script fetches a command from DNS"
tier: 2
attack_class: PROMPT_INJECTION_INDIRECT
target: "Claude Code, and agentic coding tools that run shell commands"
date: "2026-06-25"
summary: >-
  Mozilla's 0DIN group published a worked demonstration against agentic coding
  tools in which a repository contains no malicious code at all. A package in
  the repo refuses to work until an init step is run, so the coding agent
  treats that error as routine recovery, and the init script reads a value
  from a DNS TXT record and executes it. The authors report the value
  decoded to a reverse shell and ran as the developer's own user, with the
  developer's terminal showing only two ordinary-looking setup lines. Because
  the payload is fetched at run time, the source states no scanner, reviewer
  or the agent itself ever sees it. No specific vulnerable product version is
  named or affected range stated.
impact: >-
  The attacker gains an interactive shell as the developer's user, plus every
  secret in the environment such as API keys, and can install persistence
  first. Class choice: PROMPT_INJECTION_INDIRECT, because the instructions
  travel in retrieved repository content the agent read on its own initiative
  and the payload is fetched from DNS at run time. INSECURE_OUTPUT_HANDLING
  and TOOL_POISONING were rejected: the repository is ordinary content and the
  payload is not a tool definition.
mitigation: >-
  Treat setup instructions and scripts in unfamiliar repositories as untrusted
  code, as the source recommends, whatever the coding tool advises. Read what
  a setup command will actually run, including the contents of any script it
  invokes and anything that script fetches at run time, and alert on shell
  constructs such as command substitution and piping a fetched value into a
  shell.
sources:
  - url: https://0din.ai/blog/clone-this-repo-and-i-own-your-machine
    kind: primary
    title: "Clone This Repo and I Own Your Machine (0DIN)"
  - url: https://www.bleepingcomputer.com/news/security/clean-github-repo-tricks-ai-coding-agents-into-running-malware
    kind: secondary
    title: "Clean GitHub repo tricks AI coding agents into running malware"
last_verified: "2026-10-04"
