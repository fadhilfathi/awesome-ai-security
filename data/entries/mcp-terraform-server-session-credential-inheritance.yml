id: mcp-terraform-server-session-credential-inheritance
title: "terraform-mcp-server executes a user's tool calls with another user's cached Terraform credentials"
tier: 2
attack_class: CREDENTIAL_EXPOSURE
target: "HashiCorp terraform-mcp-server 0.3.0 through 1.0.0 per the CVE records, or 0.2.1 per vendor bulletin HCSEC-2026-23, stateful streamable-HTTP mode"
date: "2026-07-28"
summary: >-
  HashiCorp's terraform-mcp-server is meant for centralised multi-user
  deployments in which each caller supplies their own Terraform Cloud or
  Enterprise token so that RBAC applies to their actions. In stateful
  streamable-HTTP mode the server cached a Terraform API client per MCP session,
  keyed on the session ID alone and never bound to the token that created it, so
  a caller who obtained another user's session ID had their tool calls run
  against that user's cached client and bearer token. HashiCorp identified the
  issue internally and published it as part of a three-CVE bulletin; it was
  reported by Juan Pablo Martinez Kuhn of Coinspect and fixed in 1.1.0.
impact: >-
  The attacker's tool calls execute with the victim's Terraform bearer token, so
  they reach the victim's organizations, workspaces and variables to the extent
  that token's permissions allow, and they can write as well as read. This is
  CREDENTIAL_EXPOSURE because the item the sources name as reaching an
  unintended principal is a bearer token and the access it authorises; it is not
  merely DATA_EXFILTRATION. The CISA enrichment reports exploitation as none.
  It affected only stateful streamable HTTP, the default for central
  deployments.
mitigation: >-
  Upgrade to terraform-mcp-server 1.1.0. Operators who cannot upgrade should
  restrict network access to the streamable-HTTP listener to trusted users and
  treat MCP session IDs as sensitive values, since the cache lookup is keyed on
  the session ID and nothing else.
