id: agent-app-kong-konnect-mcp-stored-injection
title: "Stored prompt injection in Kong Konnect MCP analytics data leads to configuration disclosure"
tier: 2
attack_class: DATA_EXFILTRATION
target: "Kong Konnect Model Context Protocol server (mcp-konnect), versions below 1.0.0"
date: "2026-05-15"
summary: >-
  Kong's security advisory for the Konnect MCP server describes an
  attacker who can send traffic to a gateway planting instructions in
  request metadata such as the User-Agent. That metadata is stored in
  Konnect analytics and later returned to an AI assistant by the
  server's analytics tools without neutralisation, so the assistant reads
  attacker text as instructions; the advisory is GHSA-7767-3m3w-2p44,
  CVE-2026-13341. Kong prepared the fixes in release 1.0.0.
impact: >-
  Kong states that in client environments which fetch remote resources
  from model output, this could disclose sensitive information to an
  attacker-controlled URL, exposing secrets or configuration values other
  MCP tools return, including plugin configuration data, plus internal
  hostnames. A separate path manipulation flaw let the server request
  unintended Konnect API endpoints with the user's token. The taxonomy keys
  on the item set the source names: the advisory names configuration values
  and hostnames, not a credential, token or key, so this is
  DATA_EXFILTRATION.
mitigation: >-
  Upgrade to 1.0.0 or later, where Kong neutralises untrusted analytics
  fields before returning them, validates identifiers as UUIDs and encodes
  path segments. Leave raw plugin configuration output disabled unless it
  is strictly required. Sand-box the agent so tool output cannot trigger
  automatic remote fetches, block automatic rendering of remote content and
  model-generated links, and apply egress controls to keep agent runtimes
  off untrusted external hosts.
sources:
  - url: https://github.com/Kong/mcp-konnect/security/advisories/GHSA-7767-3m3w-2p44
    kind: primary
    title: "Stored Prompt Injection and Credential Exposure via Untrusted Analytics Data in Kong Konnect MCP (GHSA-7767-3m3w-2p44)"
  - url: https://cveawg.mitre.org/api/cve/CVE-2026-13341
    kind: primary
    title: "CVE-2026-13341 Kong Konnect MCP server record"
cve:
  - CVE-2026-13341
last_verified: "2026-10-05"