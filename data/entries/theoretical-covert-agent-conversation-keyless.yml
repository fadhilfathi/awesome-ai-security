id: theoretical-covert-agent-conversation-keyless
title: "Keyless covert channel argued possible between two LLM agents holding no shared secret"
tier: 3
attack_class: DATA_EXFILTRATION
target: "Any deployment where two LLM agents converse and a third party reads their transcript"
date: "2026-04-06"
summary: >-
  A cryptography paper asks whether two agents operated by different entities
  can hold a private side conversation while their visible transcript stays
  computationally indistinguishable from an honest exchange, even for an
  auditor who knows the models, the protocol, and each side's context. It proves
  covert conversation is possible in the shared-key case, then works the harder
  keyless case where the two agents begin with no shared secret, introducing a
  primitive it calls pseudorandom noise-resilient key exchange for that setting.
  The results are constructive and negative; the authors report no system
  attacked.
impact: >-
  The gain argued for is a hidden channel: content that a transcript reader,
  including a monitoring service, cannot distinguish from ordinary output, which
  turns monitoring of agent-to-agent traffic into a losing position for the
  defender. The paper's assumptions are stated tightly, that honest messages
  carry at least constant min-entropy and the protocol is adaptive, and its
  negative results also warn that weaker key-exchange variants admit efficient
  attacks. No third party is shown to be fooled in practice.
mitigation: >-
  Treat a text transcript of an agent conversation as unverified and do not
  treat readability as evidence of absence of covert content. Where the two
  agents belong to different principals, gate inter-agent messaging on an
  attested policy rather than on inspection of the text. The paper's negative
  results argue against rolling your own covert-resistant key exchange.
sources:
