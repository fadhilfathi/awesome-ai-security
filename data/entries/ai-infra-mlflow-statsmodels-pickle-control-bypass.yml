id: ai-infra-mlflow-statsmodels-pickle-control-bypass
title: "MLflow statsmodels flavor loads pickle artifacts despite the deserialization control"
tier: 2
attack_class: SUPPLY_CHAIN_MODEL
target: "MLflow 2.1.0 to before 3.15.0 (pip package mlflow), the statsmodels model flavor"
date: "2026-09-01"
summary: >-
  MLflow added an environment-variable control, MLFLOW_ALLOW_PICKLE_DESERIALIZATION, after a
  run of unsafe pickle loading flaws in its model flavors. The statsmodels flavor never
  consulted that control: its loader called the pickle-based reader in the statsmodels library
  directly, while sibling flavors such as sklearn raised an error instead. An attacker who can
  place a crafted MLmodel artifact into an accessible artifact store therefore gets code
  execution on any process that loads that model through mlflow.pyfunc.load_model(), even with
  the control set to False. The advisory lists 3.15.0 as the patched version.
impact: >-
  The advisory states that the malicious pickle file executes arbitrary code with the privileges
  of the calling process, and that on default MLflow deployments without the basic-auth app
  authentication is disabled, so uploading an artifact requires no credentials. The control the
  operator was told they had set to False gave no protection on this flavor. The compromise is
  carried by a model artifact planted for another party to load, not by a package resolved in an
  index, so the direction rule in the taxonomy makes this SUPPLY_CHAIN_MODEL rather than
  SUPPLY_CHAIN_PACKAGE.
mitigation: >-
  Upgrade to MLflow 3.15.0 or later. Until then, do not rely on
  MLFLOW_ALLOW_PICKLE_DESERIALIZATION as the only control: treat any artifact store as
  untrusted, load only artifacts whose provenance you control, and run
  mlflow.pyfunc.load_model() in a process that holds nothing worth taking.
sources:
  - url: https://github.com/mlflow/mlflow/security/advisories/GHSA-gqvg-gmmx-x4hm
    kind: primary
    title: "MLFLOW_ALLOW_PICKLE_DESERIALIZATION=False safety control bypassed by mlflow.statsmodels flavor (GHSA-gqvg-gmmx-x4hm)"
last_verified: "2026-10-04"
