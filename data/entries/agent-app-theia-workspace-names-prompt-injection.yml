id: agent-app-theia-workspace-names-prompt-injection
title: "Indirect prompt injection through workspace file and directory names in Eclipse Theia AI chat"
tier: 2
attack_class: PROMPT_INJECTION_INDIRECT
target: "Eclipse Theia AI chat agent, versions prior to 1.71.0"
date: "2026-06-18"
summary: >-
  The CVE record for Eclipse Theia states that before 1.71.0 the AI chat
  agent processed workspace file and directory names as part of its prompt
  context without distinguishing them from system instructions. A repository
  whose names are chosen by an attacker therefore instructs the agent as
  soon as the agent analyses that workspace. The record assigns
  CVE-2026-44688 to the flaw and cites an Eclipse Foundation work item.
impact: >-
  The CVE record states the injected names enable attack chains leading to
  data exfiltration through Markdown image rendering, or to arbitrary command
  execution through task definitions, so the attacker gains session data or
  code execution from a repository the developer merely opened. The record
  names no credential as the item reaching the attacker, so this is not
  CREDENTIAL_EXPOSURE, and TOOL_POISONING and INSECURE_OUTPUT_HANDLING were
  both rejected because the payload arrived in neither a tool definition nor
  an output handler. CISA recorded no exploitation for this CVE.
mitigation: >-
  Upgrade to 1.71.0 or later. Until then, do not run AI features over an
  untrusted clone, and grant workspace trust deliberately. Treat a repository
  name as untrusted input in the same way as any other retrieved content,
  because the agent cannot tell the difference once the name is in its
  context.
