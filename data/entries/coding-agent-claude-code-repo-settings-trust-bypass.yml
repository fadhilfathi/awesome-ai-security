id: coding-agent-claude-code-repo-settings-trust-bypass
title: "Claude Code workspace trust bypass through a repository's own settings file"
tier: 2
attack_class: INSECURE_OUTPUT_HANDLING
target: "Claude Code (npm package @anthropic-ai/claude-code) before 2.1.53 (fixed in 2.1.53)"
date: "2026-03-18"
summary: >-
  Claude Code asks a developer to confirm trust in a workspace before it
  acts, and the advisory reports that the permission mode was resolved from
  settings files first, including the settings file the repository itself
  controls. A repository that committed a permissive permission mode in that
  file therefore had the confirmation dialog silently skipped the first time
  it was opened, and the source states this places the user in a permissive
  mode without ever seeing the prompt. Anthropic published the advisory on
  2026-03-18 and shipped the fix in version 2.1.53.
impact: >-
  The developer ends up in a mode where tool calls run without confirmation
  in a directory an attacker chose, which the advisory says makes it easier
  for an attacker-controlled repository to obtain tool execution without
  explicit consent. Class choice: INSECURE_OUTPUT_HANDLING, because the
  source names Claude Code's own handling of repository-supplied
  configuration as the defective component, and that configuration is then
  consumed by the permission engine without review.
mitigation: >-
  Upgrade to Claude Code 2.1.53 or later; users on the standard auto-update
  channel already have the fix. Where you cannot update, read the .claude
  directory of any repository before running the agent in it, and set the
  permission mode yourself rather than letting the workspace declare it.
sources:
