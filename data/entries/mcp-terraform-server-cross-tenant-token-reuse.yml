id: mcp-terraform-server-cross-tenant-token-reuse
title: "terraform-mcp-server stateless HTTP mode reuses one tenant's Terraform token for other tenants' tool calls"
tier: 2
attack_class: CREDENTIAL_EXPOSURE
target: "HashiCorp terraform-mcp-server 0.2.1 through 1.0.0, stateless streamable-HTTP mode"
date: "2026-07-28"
summary: >-
  When terraform-mcp-server is configured for stateless streamable HTTP, the
  underlying MCP library assigns no unique session identifiers to requests. The
  server's per-session Terraform client cache still relied on those identifiers
  to tell callers apart, so the tenant who arrived first had their Terraform
  token used to execute tool calls on behalf of every tenant after them, whatever
  credentials those later callers supplied. HashiCorp found the issue internally
  and fixed it in 1.1.0 alongside two related flaws in the same transport.
impact: >-
  A caller who supplies their own Terraform token can have tool calls executed
  under a different tenant's identity instead of their own, so reads and writes
  land on the wrong organization's state. The item the sources name as crossing
  tenants is the Terraform token, which makes this CREDENTIAL_EXPOSURE rather
  than DATA_EXFILTRATION even though organization data is also at stake.
  HashiCorp scored it 10.0 but reported no exploitation; the defect requires
  that an operator explicitly opted into stateless mode.
mitigation: >-
  Upgrade to terraform-mcp-server 1.1.0. Until then, do not run terraform-mcp-server
  in stateless streamable-HTTP mode for a multi-tenant deployment, and restrict
  network access to the streamable-HTTP listener to trusted users.
sources:
