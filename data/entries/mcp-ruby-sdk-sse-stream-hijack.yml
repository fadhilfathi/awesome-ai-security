id: mcp-ruby-sdk-sse-stream-hijack
title: "MCP Ruby SDK lets a second connection replace a live SSE stream and take its tool responses"
tier: 2
attack_class: DATA_EXFILTRATION
target: "MCP Ruby SDK (RubyGems gem mcp) 0.9.1 and earlier, streamable HTTP transport"
date: "2026-03-27"
summary: >-
  The Ruby implementation of MCP keeps one Server-Sent Events stream per session
  ID, and when a second client presents the same session ID it silently
  overwrites the stored stream with its own instead of rejecting the connection
  or checking who owns the session. The reporter attached two Python client
  scripts demonstrating the takeover against the SDK's own example server: the
  legitimate client's notifications stop and the second client begins receiving
  all of them. The transport also records no user identity against a session.
  Version 0.9.2 carries the patch.
impact: >-
  Anyone who learns a session ID can take over that session's event stream and
  receive every subsequent tool response the server sends, which the advisory
  describes as sensitive, while the legitimate user receives nothing and gets no
  indication of the hijack. The advisory records that of the ten official MCP
  SDKs, only the C# and Go SDKs bound session IDs to user identity at the time
  of the report. This is DATA_EXFILTRATION rather than CREDENTIAL_EXPOSURE
  because the item the source names as reaching the wrong party is the tool
  responses. CISA reports exploitation as a proof of concept.
mitigation: >-
  Upgrade to mcp 0.9.2 or later. The advisory's stated guidance for SDK
  maintainers is to bind session IDs to authenticated user identity where
  possible and to reject a second simultaneous connection for the same session,
  and it notes that SDK documentation gave operators no secure session
  management guidance. Operators should enforce that binding themselves and
  treat session IDs as values that must not be logged or exposed in URLs.
sources:
  - url: https://github.com/modelcontextprotocol/ruby-sdk/security/advisories/GHSA-qvqr-5cv7-wh35
