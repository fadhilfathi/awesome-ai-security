id: ai-infra-qdrant-logger-file-append
title: "Qdrant /logger endpoint writes attacker-supplied log lines to a caller-chosen path"
tier: 2
attack_class: AGENT_PRIVILEGE_ABUSE
target: "Qdrant 1.9.3 to before 1.16.0 (cargo crate qdrant), the POST /logger endpoint"
date: "2026-02-05"
summary: >-
  The Qdrant logging endpoint takes an on-disk log file path from the request body. In affected
  releases nothing constrained that path, and the endpoint needed only read-level access, so a
  low-privilege caller could point logging at a file the service can write and then inject content
  into it through any other request whose parameters get logged. The advisory works the attack
  through by setting the path to the service's configuration file and requesting a collection
  whose name carries newlines and YAML. The project shipped a fix in 1.16.0.
impact: >-
  The advisory demonstrates the injected content becoming valid configuration that takes
  precedence after a restart, redirecting the static content directory so that files including
  the password file become readable through the web UI, and notes that overriding configuration
  may also let the caller set a master key. The gain outlives the single request and is an
  authority the caller granted itself, which the taxonomy tie-break on persistence settles as
  AGENT_PRIVILEGE_ABUSE over DATA_EXFILTRATION. The advisory tested 1.15.5 and reports no
  exploitation outside its own reproduction.
mitigation: >-
  Upgrade to Qdrant 1.16.0 or later. The advisory's own two mitigations apply regardless:
  restrict the /logger endpoint to users holding management privileges or disable it outright,
  and constrain the log file path to a dedicated logs directory. Keep the configuration directory
  non-writable by the service, which is also why Qdrant Cloud is unaffected.
sources:
  - url: https://github.com/qdrant/qdrant/security/advisories/GHSA-f632-vm87-2m2f
    kind: primary
    title: "Arbitrary file write via /logger endpoint (GHSA-f632-vm87-2m2f)"
  - url: https://cveawg.mitre.org/api/cve/CVE-2026-25628
    kind: primary
    title: "CVE-2026-25628 CVE record for the Qdrant logger file write"
cve:
  - CVE-2026-25628
last_verified: "2026-10-04"
