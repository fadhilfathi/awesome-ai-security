id: ai-infra-hf-transformers-model-file-deserialization
title: "Hugging Face Transformers executes code while parsing model files for several architectures"
tier: 2
attack_class: SUPPLY_CHAIN_MODEL
target: "Hugging Face Transformers Perceiver, Transformer-XL, megatron_gpt2 and GLM4 model files, release 4.57.1 named for GLM4"
date: "2025-12-23"
summary: >-
  The Zero Day Initiative reported and published four related flaws in Hugging Face Transformers,
  covering the Perceiver, Transformer-XL, megatron_gpt2 and GLM4 model classes. In each case the
  parser for the corresponding model file, checkpoint or weight set validated no part of the
  attacker-supplied data before deserializing it, so the file itself carried executable content.
  The records and advisories state that the target must visit a malicious page or open a
  malicious file, and that the code then runs as the current user or in the current process. None
  of the four carries a fixed version.
impact: >-
  Opening a model file the attacker supplied runs their code on the victim's machine, with the
  privileges of whoever loaded it. The records assign 7.8 with local attack vector and required
  user interaction, and the CISA enrichment in each record states no exploitation was seen. A
  second class was considered and rejected: MODEL_THEFT_EXTRACTION covers artefacts moving out
  of the owner's control, and here the owner pulls a tampered artefact in, which the direction
  rule in the taxonomy assigns to SUPPLY_CHAIN_MODEL.
mitigation: >-
  ZDI states that given the nature of the flaw the only salient mitigation is to restrict
  interaction with the product, and no fixed version is named for any of the four, so treat every
  model file from an untrusted source as code rather than as data. Prefer weight formats that do
  not execute on load, verify provenance and checksums of downloaded checkpoints, and load
  third-party models in a sandboxed process.
