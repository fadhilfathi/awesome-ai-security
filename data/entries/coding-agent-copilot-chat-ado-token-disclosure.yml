id: coding-agent-copilot-chat-ado-token-disclosure
title: "Azure DevOps token disclosure through GitHub Copilot Chat workspace settings in VS Code"
tier: 2
attack_class: CREDENTIAL_EXPOSURE
target: "GitHub Copilot Chat extension for Visual Studio Code before 1.136.2"
date: "2026-09-08"
summary: >-
  The Copilot Chat extension's Azure DevOps code search integration let its
  endpoint be overridden through workspace configuration. Microsoft states
  that a repository could carry a settings file redirecting those requests to
  a server the attacker controls, so that when the signed-in developer used
  code search the extension would send the request, and the user's access
  token with it, to the attacker's endpoint. The fix in Visual Studio Code
  1.136.2 removes the workspace-controlled endpoint override, including its
  legacy setting name. The vendor record reports no exploitation.
impact: >-
  The disclosed item is a sign-in access token for the user's work account,
  which Microsoft states could allow access to data and services the user is
  authorized to use, potentially including sensitive organizational
  information. Class choice: CREDENTIAL_EXPOSURE, because the source names a
  token as the exposed item and the taxonomy keys that class on the item.
  DATA_EXFILTRATION and PROMPT_INJECTION_INDIRECT were both rejected: the
  repository settings file is ordinary retrieved content rather than a prompt
  aimed at the model, and the item set named by the source is a credential.
mitigation: >-
  Update to Visual Studio Code 1.136.2 or later; Microsoft states there are
  no known workarounds. Review any repository you open for a .vscode
  settings.json that sets the code search endpoint override or its legacy
  equivalent, and treat Azure DevOps and GitHub tokens on a workstation as
  rotatable if the repository was not trusted.
