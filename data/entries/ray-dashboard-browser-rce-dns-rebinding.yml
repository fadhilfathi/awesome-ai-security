id: ray-dashboard-browser-rce-dns-rebinding
title: "Ray dashboard remote code execution from a developer's browser via DNS rebinding"
tier: 1
attack_class: AGENT_PRIVILEGE_ABUSE
target: "Ray before 2.52.0 (pip package ray), dashboard used as a development tool"
date: "2026-08-17"
summary: >-
  Ray is a distributed compute engine widely used to run AI and machine
  learning workloads, and its dashboard is normally reachable only from the
  developer's own machine during development. The dashboard relied on the
  User-Agent header starting with the string Mozilla as its browser-origin
  defence. Because the fetch specification lets a page set that header, the
  check could not distinguish a real browser navigation from a scripted
  request. Combined with a DNS rebinding attack against the browser, a
  developer who visited an attacker-controlled page, or loaded a malicious
  advertisement, could have code run on the machine serving Ray. The project
  shipped a fix in 2.52.0.
impact: >-
  The advisory describes remote code execution on the developer workstation
  with confidentiality, integrity, and availability impact all high. In
  practice that workstation holds source access, cloud credentials, and often
  the credentials for the cluster the dashboard is driving. CISA lists this
  CVE in the Known Exploited Vulnerabilities catalog, added 2026-08-17, and
  the enrichment in the CVE record states exploitation is active, so it is
  filed here as an attack with confirmed real-world use. The sources do not
  state how many victims were affected.
mitigation: >-
  Upgrade to Ray 2.52.0 or later. Until then, do not expose the Ray dashboard
  beyond localhost, and do not rely on a User-Agent check as an origin
  control; a header a page can set is not evidence that a request came from a
  browser address bar.
