id: litellm-pypi-supply-chain-trivy-compromise
title: "LiteLLM malicious PyPI releases published after a compromised CI dependency"
tier: 1
attack_class: SUPPLY_CHAIN_PACKAGE
target: "litellm v1.82.7 and v1.82.8 on PyPI, via the project's CircleCI release pipeline"
date: "2026-03-24"
summary: >-
  LiteLLM publishes itself to PyPI from an automated pipeline. On 2026-03-24
  the project pushed v1.82.7 and then v1.82.8, and both were malicious: they
  were live for roughly forty minutes before PyPI quarantined them, and the
  project worked with PyPI to delete them. The vendor's own account is that an
  unpinned Trivy security-scanner dependency in the pipeline had itself been
  compromised, ran during a scan, read the release credentials from the
  environment, and used them to publish the bad versions. The vendor named
  three contributing factors: a shared CI environment, long-lived static
  release secrets, and the unpinned scanner.
impact: >-
  Malicious code was published to a public package index under the project's
  own name and release path, so users who installed either version during the
  exposure window were affected by running attacker code on their own
  machines. The vendor reports rotating the PyPI, GitHub, and Docker
  credentials and maintainer accounts, removing roughly six thousand open
  branches, and pausing releases, and states it found no evidence of lateral
  movement into its own systems. It also states the last twenty releases show
  no indicators of compromise.
mitigation: >-
  Pin every dependency and action in a release pipeline to a verified digest
  or commit, including security scanners, and add a cooldown before adopting a
  new version of a package. Move release credentials to ephemeral identity,
  such as PyPI Trusted Publisher, rather than long-lived static secrets. Give
  each pipeline stage its own isolated environment so one compromised
  component cannot reach the release path. Sign releases so consumers can
  verify them; the vendor now signs its images with cosign. Anyone who
  installed v1.82.7 or v1.82.8 should rotate secrets present in that
  environment.
sources:
