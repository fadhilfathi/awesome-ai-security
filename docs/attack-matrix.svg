<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" role="img" aria-labelledby="matrix-title matrix-desc">
<title id="matrix-title">Attack class by evidence tier</title>
<desc id="matrix-desc">A grid of the 15 attack classes against the three evidence tiers. Each cell shows how many entries of that class sit at that tier. Cell colour encodes the tier, darkest for Tier 1, confirmed in the wild, and palest for Tier 3, theoretical. A cell with no numeral and only a dashed hairline border means nothing has been filed for that combination yet. The same figures are listed in the table below.</desc>
<style>
.m-label{font:13px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;fill:#24292f}
.m-head{font:12px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;fill:#57606a}
.m-num{font:12px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff;text-anchor:middle;dominant-baseline:middle}
.m-note{font:11px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;fill:#57606a}
</style>
<text class="m-head" x="235" y="20" text-anchor="middle">T1</text>
<text class="m-head" x="265" y="20" text-anchor="middle">T2</text>
<text class="m-head" x="295" y="20" text-anchor="middle">T3</text>
